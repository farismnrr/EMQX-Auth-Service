[workspace]
members = [".", "migration"]

[package]
name = "emqx_auth_service"
version = "0.1.1"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
async-trait = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15.7"
chrono = "0.4.42"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
] }
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "1.1.0", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-migration = "1.1.0"
rand = "0.8.5"
migration = { path = "migration" }
utoipa = { version = "5.4.0", features = ["actix_extras", "chrono"] }
utoipa-scalar = { version = "0.3.0", features = ["actix-web"] }

# OpenTelemetry
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.31", features = ["trace", "logs", "metrics", "grpc-tonic"] }
opentelemetry-semantic-conventions = "0.31"
tracing = "0.1"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
log = "0.4"
tracing-log = "0.2"
regex = "1.10"
subtle = "2.6.1"
urlencoding = "2.1"
jsonwebtoken = "9"
bcrypt = "0.16"
