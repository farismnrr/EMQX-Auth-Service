version: '3.8'

services:
  ##==========================================================================
  ## EMQX MQTT Broker (Matching Tunneling Server Configuration)
  ##==========================================================================
  emqx:
    image: emqx/emqx:5.8.0
    container_name: dev-emqx
    restart: unless-stopped

    ## Use host network mode for direct access to host services
    network_mode: "host"

    ## Volumes
    volumes:
      - ./scripts/emqx-setup.sh:/opt/emqx/emqx-setup.sh:ro
      - emqx_data:/opt/emqx/data
      - emqx_logs:/opt/emqx/log
      ## SSL Certificates (matching tunneling server: /etc/emqx/certs/)
      - ./certs:/etc/emqx/certs:ro

    ## Environment Variables
    environment:
      EMQX_NAME: "emqx"
      EMQX_HOST: "0.0.0.0"
      EMQX_NODE__NAME: "emqx@127.0.0.1"
      EMQX_CLUSTER__NAME: "emqxcl"
      EMQX_CLUSTER__DISCOVERY_STRATEGY: "manual"
      EMQX_DASHBOARD__LISTENERS__HTTP__BIND: "18083"
      EMQX_LISTENERS__SSL__DEFAULT__BIND: "8883"
      EMQX_LISTENERS__SSL__DEFAULT__ENABLE: "true"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: "/etc/emqx/certs/broker.i-ot.net.crt"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: "/etc/emqx/certs/broker.i-ot.net.key"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: "verify_none"
      EMQX_LISTENERS__WSS__DEFAULT__BIND: "8084"
      EMQX_LISTENERS__WSS__DEFAULT__ENABLE: "true"
      EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__CERTFILE: "/etc/emqx/certs/broker.i-ot.net.crt"
      EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__KEYFILE: "/etc/emqx/certs/broker.i-ot.net.key"
      EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__VERIFY: "verify_none"
      AUTH_SERVICE_URL: "${AUTH_SERVICE_URL:-http://localhost:5500}"
      API_KEY: "${API_KEY}"

    ## Health Check
    healthcheck:
      test: ["CMD", "emqx_ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    ## Init container to run setup script
    init: true

volumes:
  emqx_data:
  emqx_logs:
