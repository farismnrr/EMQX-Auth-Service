services:
  ##==========================================================================
  ## EMQX Auth Service (REST API only - connect to localhost PostgreSQL)
  ##==========================================================================
  emqx-auth-service:
    image: ghcr.io/farismnrr/emqx-auth-service:latest
    container_name: emqx-auth-service
    pull_policy: if_not_present
    restart: unless-stopped
    network_mode: host
    ports:
      - "5505:5500"
    user: "0:0"
    volumes:
      - emqx_auth_data:/app/data
    environment:
      RUST_LOG: ${RUST_LOG}
      SECRET_KEY: ${SECRET_KEY}
      API_KEY: ${API_KEY}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      MQTT_AUTH_RATE_LIMIT: ${MQTT_AUTH_RATE_LIMIT}
      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:5500/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  emqx_auth_data:
