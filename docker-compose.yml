services:
  ##==========================================================================
  ## EMQX MQTT Broker
  ##==========================================================================
  emqx:
    image: emqx/emqx:5.8.0
    container_name: emqx-broker
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./scripts/emqx-setup.sh:/opt/emqx/emqx-setup.sh:ro
      - emqx_data:/opt/emqx/data
      - emqx_logs:/opt/emqx/log
    environment:
      EMQX_NAME: "emqx"
      EMQX_HOST: "0.0.0.0"
      EMQX_DASHBOARD__LISTENERS__HTTP__BIND: "18083"
      AUTH_SERVICE_URL: "${AUTH_SERVICE_URL:-http://host.docker.internal:5500}"
      API_KEY: "${API_KEY}"
    healthcheck:
      test: ["CMD", "emqx_ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      emqx-auth-service:
        condition: service_healthy

  ##==========================================================================
  ## EMQX Auth Service
  ##==========================================================================
  emqx-auth-service:
    image: ghcr.io/farismnrr/emqx-auth-service:latest
    container_name: emqx-auth-service
    pull_policy: always
    restart: unless-stopped
    ports:
      - "5500:5500"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECRET_KEY: ${SECRET_KEY}
      API_KEY: ${API_KEY}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-db_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-db_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-emqx_auth}
      MQTT_ADMIN_ENABLED: "true"
      MQTT_BROKER_HOST: "host.docker.internal"
      MQTT_BROKER_PORT: "1883"
      MQTT_USE_TLS: "false"
      MQTT_USE_SHARED_SUB: "true"
      MQTT_PASS_ENCRYPTION_KEY: ${MQTT_PASS_ENCRYPTION_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5500/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  ##==========================================================================
  ## MySQL Database
  ##==========================================================================
  mysql:
    image: mysql:8.0
    container_name: emqx-auth-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-emqx_auth}
      MYSQL_USER: ${MYSQL_USER:-db_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-db_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  emqx_data:
  emqx_logs:
